name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python plugin/skills/architecture-governance/scripts/validate.py
      - run: python tests/validate_repository.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q plugin/skills/architecture-governance/scripts tests
